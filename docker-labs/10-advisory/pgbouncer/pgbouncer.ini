; SQL Gurukul · Lab 10 — PgBouncer (transaction pooling) — session-level advisory lock ka jaal dikhane ke liye
[databases]
lab_tiny = host=postgres port=5432 dbname=lab pool_size=1   ; sirf 1 asli connection — har client usi par

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = transaction
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
