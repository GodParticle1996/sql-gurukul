# SQL Gurukul · Lab 06 (BOSS) — CDC: WAL / binlog se live copy
#   docker compose up -d
#   Postgres node A (source, wal_level=logical) → localhost:55432   node B (naya system) → localhost:55433
#   MySQL (binlog) → localhost:33306
services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: lab }
    ports: ["55432:5432"]
  postgres_b:
    image: postgres:16
    environment: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: lab }
    ports: ["55433:5432"]
  mysql:
    image: mysql:8.0
    environment: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes", MYSQL_DATABASE: lab }
    ports: ["33306:3306"]
