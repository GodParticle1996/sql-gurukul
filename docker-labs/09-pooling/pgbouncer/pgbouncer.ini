; SQL Gurukul · Lab 09 — PgBouncer (transaction pooling)
[databases]
lab      = host=postgres port=5432 dbname=lab
lab_tiny = host=postgres port=5432 dbname=lab pool_size=1   ; sirf 1 asli connection — leak dikhane ke liye

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = transaction
default_pool_size = 20
max_client_conn = 2000
ignore_startup_parameters = extra_float_digits
