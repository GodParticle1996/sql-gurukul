# SQL Gurukul · Lab 02 — isolation, locks, deadlock
#   docker compose up -d        (Postgres 16 → localhost:55432, MySQL 8 → localhost:33306)
#   ./scripts/anomalies.sh      ./scripts/booking.sh
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: lab }
    ports: ["55432:5432"]
  mysql:
    image: mysql:8.0
    environment: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes", MYSQL_DATABASE: lab }
    ports: ["33306:3306"]
